name: CI

on:
    push:
        branches: [develop, main]
    pull_request:
        branches: [develop, main]

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  # задача 0.4 перенесёт версию в .nvmrc (node-version-file)
                  node-version: '20.20.1'
                  cache: npm

            - run: npm ci

            - run: npm run lint

            - run: npm run typecheck

            - run: npm test

            - run: npm run build
